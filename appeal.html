<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>QuestCraft Appeal Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#0D0A1A; --panel:#15102A; --panel-2:#1C1533; --border:#3A2F63; --text:#F2EEDF; --dim:#8B87A6;
         --gold:#FFD75E; --emerald:#3EE486; --danger:#FF5C7A; --sky:#5EC8FF; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; font-size:16px; min-height:100vh;
        display:flex; justify-content:center; padding:32px 16px; }
  .card{ width:100%; max-width:520px; background:var(--panel); border:2px solid var(--border); padding:24px;
         clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); }
  h1{ font-family:'Press Start 2P',monospace; font-size:13px; color:var(--gold); margin-bottom:18px; line-height:1.6; }
  h2{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--sky); margin:20px 0 10px; }
  .meta{ color:var(--dim); font-weight:600; }
  .player{ font-size:22px; font-weight:700; }
  blockquote{ border-left:3px solid var(--sky); background:var(--panel-2); padding:10px 12px; margin-top:8px; white-space:pre-wrap; }
  ol{ padding-left:20px; } li{ margin-bottom:10px; } li i{ color:var(--dim); }
  .row{ display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
  button{ flex:1; min-width:140px; font-family:'Press Start 2P',monospace; font-size:10px; border:none; padding:14px; cursor:pointer; }
  .approve{ background:var(--emerald); color:#0A2415; } .decline{ background:var(--danger); color:#fff; }
  button:disabled{ opacity:.5; cursor:default; }
  .result{ margin-top:22px; padding:14px; border:2px solid; font-weight:700; }
  .result.ok{ border-color:var(--emerald); color:var(--emerald); } .result.bad{ border-color:var(--danger); color:var(--danger); }
  .note{ font-size:13px; color:var(--dim); margin-top:14px; }
</style>
</head>
<body>
<main class="card" id="app"><h1>📨 APPEAL REVIEW</h1><p class="meta">Loading…</p></main>
<script>
const sb = window.supabase.createClient('https://gndzjvgpydjchpqqhrns.supabase.co','sb_publishable_rCcAuXMJ92-IZU7Hs53QOQ_o53sslUa');
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const id = Number(qs.get('id')), token = qs.get('token');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const when = d => new Date(d).toLocaleString();

function fail(msg){ app.innerHTML = `<h1>📨 APPEAL REVIEW</h1><div class="result bad">${esc(msg)}</div>`; }

async function load(){
  if(!id || !token){ fail('This link is missing its code. Use the button in the appeal email.'); return; }
  const { data, error } = await sb.rpc('get_appeal_by_token', { p_id:id, p_token:token });
  if(error){ fail('Could not load this appeal: ' + error.message); return; }
  if(data.error){ fail(data.error); return; }
  const history = data.history.length
    ? data.history.map(w => `<li><b>Warning #${w.n}</b>: ${when(w.at)} · by ${w.by==='auto'?'🤖 Auto-Admin':'Admin'}<br><i>${esc(w.reason)}</i></li>`).join('')
    : '<li>No warnings on record.</li>';
  const decided = data.status !== 'pending';
  app.innerHTML = `
    <h1>📨 APPEAL REVIEW</h1>
    <div class="player">Agent ${esc(data.player)}</div>
    <div class="meta">Level ${data.level} · ${data.xp} XP · sent ${when(data.sent_at)}</div>
    <h2>THEIR MESSAGE</h2>
    <blockquote>${esc(data.message)}</blockquote>
    <h2>WARNING HISTORY</h2>
    <ol>${history}</ol>
    ${decided
      ? `<div class="result ${data.status==='approved'?'ok':'bad'}">This appeal was already ${esc(data.status)}.</div>`
      : `<div class="row"><button class="approve" id="yes">✅ APPROVE</button><button class="decline" id="no">❌ DECLINE</button></div>
         <p class="note">Approve gives the account back. Decline terminates it forever, with no more appeals.</p>`}
    <div id="out"></div>`;
  if(!decided){
    document.getElementById('yes').onclick = () => decide(true);
    document.getElementById('no').onclick  = () => decide(false);
  }
}

async function decide(approve){
  if(!approve && !confirm('Decline this appeal? The account will be terminated FOREVER.')) return;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  const { data, error } = await sb.rpc('decide_appeal_by_token', { p_id:id, p_token:token, approve });
  const out = document.getElementById('out');
  if(error){
    out.innerHTML = `<div class="result bad">❌ ${esc(error.message)}</div>`;
    document.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }
  out.innerHTML = approve
    ? '<div class="result ok">✅ Approved. The account is restored and the player was emailed.</div>'
    : '<div class="result bad">⛔ Declined. The account is terminated forever and the player was emailed.</div>';
  document.querySelector('.row')?.remove();
}

load();
</script>
</body>
</html>

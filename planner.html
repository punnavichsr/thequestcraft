<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punn's Level-Up Planner</title>
<style>
  :root {
    --bg: #12141c; --panel: #1d2030; --edge: #3a3f5c; --text: #eef0ff;
    --muted: #9aa0c3; --gold: #ffcc4d; --good: #4ade80; --bad: #f87171;
    --iq: #60a5fa; --strength: #f87171; --gaming: #34d399; --sleep: #a78bfa; --other: #94a3b8;
    --accent: var(--iq);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(circle at 50% 0%, #23263a, var(--bg) 70%);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 16px; gap: 10px;
  }
  .stats-btn {
    justify-self: start; font-size: 13px; font-weight: 800; letter-spacing: 2px;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    color: #1a1a1a; background: var(--gold); border: 2px solid #fff3;
    box-shadow: 0 3px 0 #b8892a;
  }
  .stats-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8892a; }

  /* Brain.fm-style mode picker */
  .modes {
    display: flex; background: #0006; border: 1px solid var(--edge);
    border-radius: 999px; padding: 4px; gap: 4px;
  }
  .mode {
    border: none; background: none; color: var(--muted); cursor: pointer;
    padding: 9px 18px; border-radius: 999px; font-size: 15px; font-weight: 700;
    transition: background .2s, color .2s;
  }
  .mode.active { background: var(--accent); color: #0b0d14; box-shadow: 0 0 18px var(--accent); }

  .embedded .modes { display: none; }   /* opened from the game: no tab bar */
  .embedded .ai-btn { grid-column: 3; }  /* keep the AI button in the top-right corner */

  /* ---------- Main layout ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 32px; }
  .view { animation: pop .2s ease-out; }
  .view.hidden { display: none; }
  #watchView { max-width: 420px; margin: 20px auto 0; padding: 28px; }
  #watchView .dial { width: 260px; height: 260px; }
  #watchView .time { font-size: 46px; }
  .watch-type {
    padding: 8px 12px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer;
    background: #0006; color: var(--text); border: 2px solid var(--accent); margin-bottom: 8px;
  }
  @media (max-width: 800px) {
    .mode { padding: 8px 12px; font-size: 14px; }
    .topbar { grid-template-columns: auto 1fr auto; }
    .modes { justify-self: center; }
  }
  .card {
    background: var(--panel); border: 2px solid var(--edge); border-radius: 16px; padding: 18px;
  }
  .card h3 { margin: 0 0 12px; letter-spacing: 2px; font-size: 14px; color: var(--muted); }

  /* ---------- Stopwatch ---------- */
  .watch { text-align: center; }
  .dial {
    width: 220px; height: 220px; margin: 6px auto 16px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    border: 4px solid var(--accent); box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent);
    transition: border-color .3s, box-shadow .3s;
  }
  .dial.running { animation: glow 2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 55px var(--accent); } }
  .time { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dial .label { position: absolute; bottom: 48px; font-size: 13px; color: var(--muted); letter-spacing: 2px; }
  .watch-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 16px; border-radius: 10px; font-weight: 800; cursor: pointer;
    border: 2px solid var(--edge); background: #2a2e45; color: var(--text);
  }
  .btn.primary { background: var(--accent); color: #0b0d14; border-color: transparent; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--good); }

  /* ---------- Timetable ---------- */
  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day-nav button { background: #2a2e45; border: 2px solid var(--edge); color: var(--text);
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .day-title { text-align: center; }
  .day-title b { font-size: 18px; display: block; }
  .day-title span { font-size: 12px; color: var(--muted); }

  .add-form { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 6px; margin-bottom: 12px; }
  .add-form input, .add-form select {
    padding: 8px; border-radius: 8px; background: #0006; color: var(--text);
    border: 2px solid var(--edge); font-size: 14px; min-width: 0;
  }
  @media (max-width: 560px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form input[type=text] { grid-column: span 2; } }

  .grid-wrap { height: 520px; overflow-y: auto; border-radius: 10px; background: #0003; }
  .grid { position: relative; margin-left: 52px; }
  .hour { height: 48px; border-top: 1px solid #ffffff12; position: relative; }
  .hour span { position: absolute; left: -48px; top: -8px; font-size: 11px; color: var(--muted); }
  .event {
    position: absolute; left: 4px; right: 6px; border-radius: 6px; padding: 4px 8px;
    font-size: 12px; overflow: hidden; color: #0b0d14; font-weight: 700;
    border-left: 4px solid #0004;
  }
  .event small { display: block; font-weight: 500; opacity: .8; }
  .event .x {
    position: absolute; top: 2px; right: 4px; border: none; background: #0003; color: #0b0d14;
    border-radius: 4px; cursor: pointer; font-weight: 800; padding: 0 5px;
  }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 5; }
  .now-line::before { content: ""; position: absolute; left: -6px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .copy-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Planner ---------- */
  .plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .plan-head h3 { margin: 0; font-size: 18px; color: var(--text); }
  .scene { border-radius: 12px; overflow: hidden; border: 2px solid var(--pc, var(--edge)); box-shadow: 0 0 24px color-mix(in srgb, var(--pc, #000) 35%, transparent); }
  .scene img { display: block; width: 100%; height: auto; }
  .scene .empty { padding: 60px 20px; text-align: center; color: var(--muted); background: #0004; }
  .scene .empty b { display: block; font-size: 54px; margin-bottom: 8px; }
  .plan-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; margin-top: 6px;
    border-radius: 8px; background: #0004; border-left: 4px solid var(--pc); font-size: 14px; }
  .plan-item span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .plan-none { color: var(--muted); font-size: 13px; }

  /* ---------- Left tools + sidebar ---------- */
  .left-tools { justify-self: start; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .side-btn {
    width: 40px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 18px;
    background: #2a2e45; color: var(--text); border: 2px solid var(--edge);
  }
  .side-btn:hover { border-color: var(--accent); }
  .sidebar, .ai-panel {
    position: fixed; top: 0; bottom: 0; z-index: 60; background: var(--panel);
    border: 2px solid var(--edge); padding: 16px; display: flex; flex-direction: column;
    transition: transform .25s ease; box-shadow: 0 0 40px #0009;
  }
  .sidebar { overflow-y: auto; left: 0; width: 260px; transform: translateX(-105%); border-left: none; }
  .sidebar.open { transform: none; }
  .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; letter-spacing: 2px; }
  .side-hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
  .side-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 8px;
    border-radius: 12px; border: 2px solid var(--edge); background: #0004; color: var(--text);
    cursor: pointer; text-align: left; font-size: 16px; font-weight: 700;
  }
  .side-item .ico { font-size: 26px; }
  .side-item small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side-del { color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 14px; }
  .side-del:hover { color: var(--bad); background: #0005; }
  [hidden] { display: none !important; }
  .side-item.active { border-color: var(--c); box-shadow: 0 0 16px var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }

  /* ---------- AI ---------- */
  .ai-btn {
    justify-self: end; display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 14px;
    background: #0006; color: var(--text); border: 2px solid #f97316;
    box-shadow: 0 0 14px #f9731655;
  }
  .ai-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #f97316; box-shadow: 0 0 10px #f97316; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.4); opacity: .7; } }
  .ai-panel { right: 0; width: 380px; max-width: 100vw; transform: translateX(105%); border-right: none; }
  .ai-panel.open { transform: none; }
  .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
  .ai-settings { display: none; flex-direction: column; gap: 8px; padding: 12px; margin-bottom: 10px;
    border-radius: 12px; background: #0004; border: 1px solid var(--edge); }
  .ai-settings.show { display: flex; }
  .ai-settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .ai-settings input, .ai-input input {
    padding: 9px; border-radius: 8px; background: #0006; color: var(--text);
    border: 2px solid var(--edge); font-size: 14px; min-width: 0;
  }
  .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .bubble { max-width: 88%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .bubble.me { align-self: flex-end; background: #f97316; color: #1a0f05; border-bottom-right-radius: 4px; }
  .bubble.ai { align-self: flex-start; background: #2a2e45; border-bottom-left-radius: 4px; }
  .bubble.note { align-self: center; background: #4ade8022; color: var(--good); font-size: 12px; }
  .bubble.err { align-self: center; background: #f8717122; color: var(--bad); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    background: #0004; color: var(--muted); border: 1px solid var(--edge); }
  .chip:hover { color: var(--text); border-color: #f97316; }
  .ai-input { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .ai-input .btn { background: #f97316; }
  @media (max-width: 800px) { .ai-btn #aiBtnName { display: none; } }

  /* ---------- Stats popup ---------- */
  .overlay { position: fixed; inset: 0; background: #000a; display: none; place-items: center; padding: 16px; z-index: 100; }
  .overlay.show { display: grid; }
  .panel {
    width: 100%; max-width: 440px; background: var(--panel); border: 3px solid var(--edge);
    border-radius: 16px; padding: 20px; box-shadow: 0 20px 50px #0008; animation: pop .2s ease-out;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .head h2 { margin: 0; letter-spacing: 2px; }
  .close { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; }
  .points { color: var(--gold); font-weight: 700; margin-bottom: 10px; }
  .amount { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .amount input { width: 100px; padding: 8px; border-radius: 8px; font-size: 16px; font-weight: 700;
    background: #0006; color: var(--gold); border: 2px solid var(--edge); }
  .stat { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; margin: 12px 0; }
  .icon { font-size: 24px; text-align: center; }
  .name { font-weight: 700; display: flex; justify-content: space-between; }
  .bar { height: 10px; background: #0006; border-radius: 6px; margin-top: 5px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .2s; }
  .ctrl { display: flex; gap: 6px; }
  .ctrl button { width: 36px; height: 36px; border-radius: 8px; font-size: 20px; font-weight: 800;
    cursor: pointer; border: 2px solid var(--edge); background: #2a2e45; color: var(--text); }
  .ctrl .minus:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .ctrl .plus:hover:not(:disabled) { border-color: var(--good); color: var(--good); }
  .ctrl button:disabled { opacity: .3; cursor: not-allowed; }
  .ctrl .del { width: 28px; font-size: 14px; color: var(--muted); border-style: dashed; }
  .ctrl .del:hover { color: var(--bad); border-color: var(--bad); }
  .icon-in, .name-in, .add-stat input {
    background: #0006; color: var(--text); border: 2px dashed var(--edge); border-radius: 8px; font: inherit; min-width: 0;
  }
  .icon-in { width: 34px; height: 34px; text-align: center; font-size: 18px; padding: 0; }
  .name-in { width: 130px; padding: 2px 6px; font-weight: 700; }
  .icon-in:focus, .name-in:focus, .add-stat input:focus { border-color: var(--gold); outline: none; }
  .add-stat { display: grid; grid-template-columns: 56px 1fr auto; gap: 6px; margin-top: 14px; }
  .add-stat input { padding: 9px; font-size: 14px; }
  #newStatIcon { text-align: center; }
  .panel { max-height: 92vh; overflow-y: auto; }
  .reset { width: 100%; margin-top: 14px; padding: 10px; border-radius: 10px; cursor: pointer;
    background: none; border: 2px dashed var(--edge); color: var(--muted); font-weight: 700; }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div class="left-tools">
    <button class="stats-btn" id="openBtn">STATS</button>
    <button class="side-btn" id="sideBtn" aria-label="Open activity sidebar">☰</button>
  </div>
  <div class="modes" id="modes">
    <button class="mode active" data-view="watchView">⏱️ Stopwatch</button>
    <button class="mode" data-view="tableView">📅 Timetable</button>
    <button class="mode" data-view="plannerView">🧍 Planner</button>
  </div>
  <button class="ai-btn" id="aiBtn"><span class="ai-dot"></span><span id="aiBtnName">AI</span></button>
</div>

<!-- ===== ACTIVITY SIDEBAR (left) ===== -->
<aside class="sidebar" id="sidebar">
  <div class="side-head"><b>ACTIVITY</b><button class="close" id="sideClose" aria-label="Close">✕</button></div>
  <p class="side-hint">Pick an activity to see it in the Planner.</p>
  <div id="sideList"></div>
  <form class="add-stat" id="addActForm" style="grid-template-columns:48px 1fr; margin-top:8px">
    <input id="newActIcon" placeholder="icon" maxlength="4" autocomplete="off" title="Your own icon (emoji)">
    <input id="newActName" placeholder="New activity, e.g. Piano" maxlength="20" autocomplete="off">
    <button class="btn primary" style="grid-column:span 2">+ Add activity</button>
  </form>
</aside>

<!-- ===== AI CHAT (right) ===== -->
<aside class="ai-panel" id="aiPanel">
  <div class="side-head">
    <b><span class="ai-dot"></span> <span id="aiTitle">AI</span></b>
    <div>
      <button class="icon-btn" id="aiSetBtn" title="Settings">⚙️</button>
      <button class="close" id="aiClose" aria-label="Close">✕</button>
    </div>
  </div>

  <div class="ai-settings" id="aiSettings">
    <label>AI name <input id="setName" placeholder="e.g. Nova"></label>
    <label>Groq API key <input id="setKey" type="password" placeholder="gsk_..."></label>
    <label>Model <input id="setModel"></label>
    <button class="btn primary" id="setSave">Save</button>
    <div class="msg" id="setMsg" style="margin:0"></div>
    <p class="side-hint">Get a free key at console.groq.com → API Keys. It's saved only in this browser. Never share it with anyone.</p>
  </div>

  <div class="chat" id="chat"></div>
  <div class="chips">
    <button class="chip">Plan my evening</button>
    <button class="chip">What's on tomorrow?</button>
    <button class="chip">Add 1h football at 17:00 tomorrow</button>
  </div>
  <form class="ai-input" id="aiForm">
    <input id="aiMsg" placeholder="Ask me to plan something..." autocomplete="off">
    <button class="btn primary">➤</button>
  </form>
</aside>

<main>
  <!-- ===== STOPWATCH ===== -->
  <section class="card watch view" id="watchView">
    <h3>STOPWATCH</h3>
    <select class="watch-type" id="watchType">
      <option value="iq">🧠 IQ</option>
      <option value="strength">💪 Strength</option>
      <option value="gaming">🎮 Gaming</option>
      <option value="sleep">😴 Sleep</option>
      <option value="other">⚪ Other</option>
    </select>
    <div class="dial" id="dial">
      <div class="time" id="time">00:00:00</div>
      <div class="label" id="modeLabel">IQ</div>
    </div>
    <div class="watch-btns">
      <button class="btn primary" id="startBtn">Start</button>
      <button class="btn" id="logBtn" disabled>Stop &amp; Log</button>
      <button class="btn" id="resetWatch" disabled>Reset</button>
    </div>
    <div class="msg" id="watchMsg"></div>
  </section>

  <!-- ===== TIMETABLE ===== -->
  <section class="card view hidden" id="tableView">
    <div class="day-nav">
      <button id="prevDay" aria-label="Previous day">◀</button>
      <div class="day-title"><b id="dayName">Today</b><span id="dayDate"></span></div>
      <button id="nextDay" aria-label="Next day">▶</button>
    </div>

    <div class="add-form">
      <input type="text" id="evTitle" placeholder="What? (e.g. Math homework)">
      <input type="time" id="evStart" value="16:00">
      <input type="time" id="evEnd" value="17:00">
      <select id="evType">
        <option value="iq">🧠 IQ</option>
        <option value="strength">💪 Strength</option>
        <option value="gaming">🎮 Gaming</option>
        <option value="sleep">😴 Sleep</option>
        <option value="other">⚪ Other</option>
      </select>
      <button class="btn primary" id="addBtn">Add</button>
    </div>

    <div class="grid-wrap" id="gridWrap"><div class="grid" id="grid"></div></div>

    <div class="copy-row">
      <button class="btn" id="copyBtn">Copy this day → next day</button>
    </div>
    <div class="msg" id="tableMsg"></div>
  </section>

  <!-- ===== PLANNER ===== -->
  <section class="card view hidden" id="plannerView">
    <div class="plan-head">
      <h3 id="planTitle">PLANNER</h3>
      <button class="btn" id="planPick">Change activity ☰</button>
    </div>
    <div class="scene" id="scene"></div>
    <div class="copy-row">
      <button class="btn" id="picBtn">🖼️ Upload picture</button>
      <button class="btn" id="picRemove" hidden>Remove my picture</button>
      <input type="file" id="picFile" accept="image/*" hidden>
    </div>
    <p class="side-hint" id="aiCredit" style="margin:8px 0 0">Scene pictures made with AI.</p>
    <div class="msg" id="planMsg"></div>
    <h3 style="margin-top:16px">TODAY'S PLAN FOR THIS</h3>
    <div id="planList"></div>
  </section>
</main>

<!-- ===== STATS POPUP ===== -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="head">
      <h2>CHARACTER STATS</h2>
      <button class="close" id="closeBtn" aria-label="Close">✕</button>
    </div>
    <div class="points">Points left: <span id="pts"></span></div>
    <label class="amount">Amount per click: <input type="number" id="amount" value="1" min="1"></label>
    <div id="list"></div>
    <form class="add-stat" id="addStatForm">
      <input id="newStatIcon" placeholder="icon" maxlength="4" title="Your own icon (emoji)" autocomplete="off">
      <input id="newStatName" placeholder="Add your own stat, e.g. Working" maxlength="20" autocomplete="off">
      <button class="btn primary">+ Add</button>
    </form>
    <div class="msg" id="statMsg"></div>
    <button class="reset" id="resetBtn">Reset points</button>
  </div>
</div>

  // ================= SAVE / LOAD =================
  // Saves your timetable in this browser so it's still there tomorrow.
  const SAVE_KEY = "punn-levelup-v1";
  let save = { events: {} };
  try { save = JSON.parse(localStorage.getItem(SAVE_KEY)) || save; } catch (e) {}
  function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch (e) { return false; } }

  // ================= MODES (top middle) =================
  const MODES = {
    iq:       { name: "IQ",       icon: "🧠", color: "var(--iq)" },
    strength: { name: "Strength", icon: "💪", color: "var(--strength)" },
    gaming:   { name: "Gaming",   icon: "🎮", color: "var(--gaming)" },
    sleep:    { name: "Sleep",    icon: "😴", color: "var(--sleep)" },
    other:    { name: "Other",    icon: "⚪", color: "var(--other)" },
  };
  let mode = "iq";

  // Top-middle switch: show Stopwatch OR Timetable
  document.querySelectorAll(".mode").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".mode").forEach(b => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("hidden", v.id !== btn.dataset.view));
      if (btn.dataset.view === "plannerView") renderPlanner();
      if (btn.dataset.view === "tableView") {
        renderDay();
        // jump to the current hour
        document.getElementById("gridWrap").scrollTop = Math.max(0, (new Date().getHours() - START_HOUR - 2) * PX_PER_HOUR);
      }
    };
  });

  // ================= ACTIVITY SIDEBAR =================
  const BUILT_IN = ["iq", "strength", "gaming"];
  const ACT_COLORS = ["#fbbf24", "#fb7185", "#38bdf8", "#f472b6", "#a3e635", "#fb923c"];
  save.activities = Array.isArray(save.activities) ? save.activities : [];   // activities you made yourself
  save.scenes = save.scenes || {};                                           // pictures you uploaded
  save.activities.forEach(a => { MODES[a.key] = { name: a.name, icon: a.icon, color: a.color, custom: true }; });
  const sideActivities = () => [...BUILT_IN, ...save.activities.map(a => a.key)];

  // Rebuild the two dropdowns (stopwatch + timetable) so they include your own activities
  function refreshTypeSelects() {
    const keys = ["iq", "strength", "gaming", "sleep", ...save.activities.map(a => a.key), "other"];
    ["watchType", "evType"].forEach(id => {
      const sel = document.getElementById(id), old = sel.value;
      sel.innerHTML = "";
      keys.forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = `${MODES[k].icon} ${MODES[k].name}`.trim(); sel.appendChild(o); });
      sel.value = MODES[old] ? old : "iq";
    });
  }

  function addActivity(name, icon) {
    name = String(name || "").trim().slice(0, 20);
    if (!name) return null;
    const a = { key: "c" + Date.now(), name, icon: String(icon || "").trim().slice(0, 4), color: ACT_COLORS[save.activities.length % ACT_COLORS.length] };
    save.activities.push(a);
    MODES[a.key] = { name: a.name, icon: a.icon, color: a.color, custom: true };
    store(); refreshTypeSelects(); renderSidebar();
    return a;
  }

  function deleteActivity(key) {
    save.activities = save.activities.filter(a => a.key !== key);
    delete save.scenes[key]; delete MODES[key];
    Object.values(save.events).forEach(arr => arr.forEach(ev => { if (ev.type === key) ev.type = "other"; }));
    if (planActivity === key) planActivity = "strength";
    if (mode === key) setWatchMode("iq");
    store(); refreshTypeSelects(); renderSidebar(); renderPlanner(); renderDay();
  }
  const sidebar = document.getElementById("sidebar");

  function minutesToday(type) {
    return (save.events[dateKey(new Date())] || [])
      .filter(ev => ev.type === type)
      .reduce((sum, ev) => sum + Math.max(0, toMin(ev.end) - toMin(ev.start)), 0);
  }

  // Stopwatch category (its own dropdown, NOT connected to the sidebar)
  function setWatchMode(m) {
    mode = m;
    document.documentElement.style.setProperty("--accent", MODES[m].color);
    document.getElementById("modeLabel").textContent = MODES[m].name;
    document.getElementById("evType").value = m;
  }
  document.getElementById("watchType").onchange = e => setWatchMode(e.target.value);

  // ================= PLANNER =================
  // Pictures for each activity. Add more: SCENES.iq = "data:image/..." or a file name next to this page.
  const SCENES = { iq: IQ_IMG, strength: PLANK_IMG, gaming: GAMING_IMG };
  const sceneFor = key => save.scenes[key] || SCENES[key];
  let planActivity = "strength";

  function showView(id) {
    document.querySelectorAll(".mode").forEach(b => b.classList.toggle("active", b.dataset.view === id));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("hidden", v.id !== id));
  }

  function renderPlanner() {
    const m = MODES[planActivity];
    const view = document.getElementById("plannerView");
    view.style.setProperty("--pc", m.color);
    document.getElementById("planTitle").textContent = `${m.icon} ${m.name.toUpperCase()}`.trim();
    const scene = document.getElementById("scene");
    scene.innerHTML = "";
    if (sceneFor(planActivity)) {
      const img = document.createElement("img");
      img.src = sceneFor(planActivity); img.alt = "Picture for " + m.name;
      scene.appendChild(img);
    } else {
      const d = document.createElement("div");
      d.className = "empty";
      d.innerHTML = "<b></b>No picture yet. Press “Upload picture” to add your own.";
      d.querySelector("b").textContent = m.icon || "🖼️";
      scene.appendChild(d);
    }
    document.getElementById("picRemove").hidden = !save.scenes[planActivity];
    // the credit shows only for the built-in AI pictures, not for pictures you upload yourself
    document.getElementById("aiCredit").hidden = Boolean(save.scenes[planActivity]) || !SCENES[planActivity];
    const items = (save.events[dateKey(new Date())] || []).filter(ev => ev.type === planActivity);
    document.getElementById("planList").innerHTML = items.length
      ? items.map(ev => `<div class="plan-item"><b>${esc(ev.title)}</b><span>${ev.start} – ${ev.end}</span></div>`).join("")
      : `<p class="plan-none">Nothing planned for ${m.name} today. Add a block in the Timetable.</p>`;
  }

  function setActivity(m) {   // called by the sidebar
    planActivity = m;
    renderSidebar(); renderPlanner(); showView("plannerView");
  }

  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function renderSidebar() {
    const list = document.getElementById("sideList");
    list.innerHTML = "";
    sideActivities().forEach(m => {
      const b = document.createElement("button");
      b.className = "side-item" + (m === planActivity ? " active" : "");
      b.style.setProperty("--c", MODES[m].color);
      const mins = minutesToday(m);
      b.innerHTML = `<span class="ico">${esc(MODES[m].icon || "?")}</span><span style="flex:1">${esc(MODES[m].name)}<small>Today: ${Math.floor(mins / 60)}h ${mins % 60}m</small></span>`
        + (MODES[m].custom ? `<span class="side-del" title="Delete this activity">✕</span>` : "");
      b.onclick = e => {
        if (e.target.classList.contains("side-del")) { deleteActivity(m); return; }
        setActivity(m); sidebar.classList.remove("open");
      };
      list.appendChild(b);
    });
  }

  document.getElementById("addActForm").onsubmit = e => {
    e.preventDefault();
    const a = addActivity(document.getElementById("newActName").value, document.getElementById("newActIcon").value);
    if (!a) { document.getElementById("newActName").focus(); return; }
    document.getElementById("newActName").value = ""; document.getElementById("newActIcon").value = "";
    setActivity(a.key); sidebar.classList.remove("open");
  };

  // Upload your own picture for the activity shown in the Planner
  document.getElementById("picBtn").onclick = () => document.getElementById("picFile").click();
  document.getElementById("picFile").onchange = e => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // shrink big photos so they fit in the browser's storage
        const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        save.scenes[planActivity] = c.toDataURL("image/jpeg", 0.8);
        if (!store()) { delete save.scenes[planActivity]; store(); flash("planMsg", "Storage is full. Remove another picture first.", true); }
        else flash("planMsg", "Picture saved ✔");
        renderPlanner();
      };
      img.onerror = () => flash("planMsg", "That file isn't a picture I can read.", true);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  document.getElementById("picRemove").onclick = () => { delete save.scenes[planActivity]; store(); renderPlanner(); flash("planMsg", "Your picture was removed."); };

  document.getElementById("sideBtn").onclick = () => { renderSidebar(); sidebar.classList.toggle("open"); };
  document.getElementById("sideClose").onclick = () => sidebar.classList.remove("open");
  document.getElementById("planPick").onclick = () => { renderSidebar(); sidebar.classList.add("open"); };

  // ================= STOPWATCH =================
  let running = false, startedAt = 0, elapsed = 0, sessionStart = null, tick;
  const timeEl = document.getElementById("time");

  function fmt(ms) {
    const t = Math.floor(ms / 1000);
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
  }
  function showTime() { timeEl.textContent = fmt(elapsed + (running ? Date.now() - startedAt : 0)); }

  document.getElementById("startBtn").onclick = function () {
    if (!running) {
      running = true; startedAt = Date.now();
      if (!sessionStart) sessionStart = new Date();
      tick = setInterval(showTime, 250);
      this.textContent = "Pause";
    } else {
      running = false; elapsed += Date.now() - startedAt;
      clearInterval(tick); this.textContent = "Resume";
    }
    document.getElementById("dial").classList.toggle("running", running);
    document.getElementById("logBtn").disabled = false;
    document.getElementById("resetWatch").disabled = false;
  };

  function resetWatch() {
    running = false; elapsed = 0; sessionStart = null; clearInterval(tick); showTime();
    document.getElementById("startBtn").textContent = "Start";
    document.getElementById("dial").classList.remove("running");
    document.getElementById("logBtn").disabled = true;
    document.getElementById("resetWatch").disabled = true;
  }
  document.getElementById("resetWatch").onclick = () => { resetWatch(); flash("watchMsg", ""); };

  // Stop & Log: puts your session onto TODAY's timetable
  document.getElementById("logBtn").onclick = () => {
    const total = elapsed + (running ? Date.now() - startedAt : 0);
    const mins = Math.round(total / 60000);
    if (mins < 1) { flash("watchMsg", "Too short to log (under 1 minute).", true); return; }
    const end = new Date(sessionStart.getTime() + total);
    addEvent(dateKey(new Date()), {
      title: `${MODES[mode].icon} ${MODES[mode].name} session (${mins} min)`,
      start: hhmm(sessionStart), end: hhmm(end), type: mode,
    });
    resetWatch();
    dayOffset = 0; renderDay();
    flash("watchMsg", `Logged ${mins} min of ${MODES[mode].name} to today ✔`);
  };

  // ================= TIMETABLE =================
  const START_HOUR = 5, END_HOUR = 24, PX_PER_HOUR = 48;
  let dayOffset = 0; // 0 = today, 1 = tomorrow, -1 = yesterday

  function dateKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function toMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
  function shownDate() { const d = new Date(); d.setDate(d.getDate() + dayOffset); return d; }

  function addEvent(key, ev) {
    (save.events[key] ||= []).push(ev);
    save.events[key].sort((a, b) => toMin(a.start) - toMin(b.start));
    store();
  }

  function renderDay() {
    const d = shownDate(), key = dateKey(d);
    document.getElementById("dayName").textContent =
      dayOffset === 0 ? "Today" : dayOffset === 1 ? "Tomorrow" : dayOffset === -1 ? "Yesterday" : d.toLocaleDateString("en-GB", { weekday: "long" });
    document.getElementById("dayDate").textContent = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "long" });

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (let h = START_HOUR; h < END_HOUR; h++) {
      const row = document.createElement("div");
      row.className = "hour";
      row.innerHTML = `<span>${String(h).padStart(2, "0")}:00</span>`;
      grid.appendChild(row);
    }

    (save.events[key] || []).forEach((ev, i) => {
      let s = toMin(ev.start), e = toMin(ev.end);
      if (e <= s) e = END_HOUR * 60;                 // e.g. sleep past midnight → stops at 24:00
      s = Math.max(s, START_HOUR * 60);
      if (e <= s) return;
      const box = document.createElement("div");
      box.className = "event";
      box.style.top = (s / 60 - START_HOUR) * PX_PER_HOUR + "px";
      box.style.height = Math.max((e - s) / 60 * PX_PER_HOUR - 2, 18) + "px";
      box.style.background = (MODES[ev.type] || MODES.other).color;
      box.innerHTML = `${esc(ev.title)}<small>${ev.start} – ${ev.end}</small><button class="x" title="Delete">✕</button>`;
      box.querySelector(".x").onclick = () => {
        save.events[key].splice(i, 1); store(); renderDay();
      };
      grid.appendChild(box);
    });

    // Red "now" line like Google Calendar
    if (dayOffset === 0) {
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      if (m >= START_HOUR * 60) {
        const line = document.createElement("div");
        line.className = "now-line";
        line.style.top = (m / 60 - START_HOUR) * PX_PER_HOUR + "px";
        grid.appendChild(line);
      }
    }
  }

  document.getElementById("addBtn").onclick = () => {
    const title = document.getElementById("evTitle").value.trim();
    const start = document.getElementById("evStart").value;
    const end = document.getElementById("evEnd").value;
    const type = document.getElementById("evType").value;
    if (!title) { flash("tableMsg", "Give it a name first ✏️", true); return; }
    if (!start || !end) { flash("tableMsg", "Pick a start and end time ⏰", true); return; }
    addEvent(dateKey(shownDate()), { title: `${MODES[type].icon} ${title}`, start, end, type });
    document.getElementById("evTitle").value = "";
    renderDay();
    flash("tableMsg", "Added ✔");
  };

  document.getElementById("copyBtn").onclick = () => {
    const from = save.events[dateKey(shownDate())] || [];
    if (!from.length) { flash("tableMsg", "Nothing to copy on this day.", true); return; }
    const next = shownDate(); next.setDate(next.getDate() + 1);
    from.forEach(ev => addEvent(dateKey(next), { ...ev }));
    dayOffset++; renderDay();
    flash("tableMsg", "Copied! Now adjust this day however you like 🛠️");
  };

  document.getElementById("prevDay").onclick = () => { dayOffset--; renderDay(); };
  document.getElementById("nextDay").onclick = () => { dayOffset++; renderDay(); };

  function flash(id, text, bad) {
    const el = document.getElementById(id);
    el.textContent = text; el.style.color = bad ? "var(--bad)" : "var(--good)";
  }

  // ================= STATS POPUP =================
  const MAX = 500;
  const POINTS_PER_STAT = 500;                     // every stat is worth 500 points
  const START_POINTS = 4 * POINTS_PER_STAT;        // 4 starting stats = 2000 points
  const DEFAULT_STATS = [
    { name: "IQ",       icon: "🧠", value: 0, start: 0, color: "#60a5fa" },
    { name: "Gaming",   icon: "🎮", value: 0, start: 0, color: "#c084fc" },
    { name: "Strength", icon: "💪", value: 0, start: 0, color: "#f87171" },
    { name: "Sleep",    icon: "😴", value: 0, start: 0, color: "#a78bfa" },
  ];
  const BONUS_PER_STAT = POINTS_PER_STAT;   // every stat you create gives +500 points
  const CUSTOM_COLORS = ["#fbbf24", "#34d399", "#fb7185", "#38bdf8", "#f472b6", "#a3e635"];
  // Your stats are saved in this browser (including the ones you make yourself)
  let stats = Array.isArray(save.stats) && save.stats.length ? save.stats : DEFAULT_STATS.map(s => ({ ...s }));
  // Points are always perfectly equal: 500 for every stat, minus what you've spent
  const budget = () => POINTS_PER_STAT * stats.length;
  let points = Math.max(0, budget() - stats.reduce((sum, s) => sum + s.value, 0));

  function getAmount() {
    const n = parseInt(document.getElementById("amount").value);
    return n > 0 ? n : 1;
  }

  function renderStats() {
    save.stats = stats; save.points = points; store();
    document.getElementById("pts").textContent = points;
    const list = document.getElementById("list");
    list.innerHTML = "";
    stats.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "stat";
      row.innerHTML = `
        <div class="icon"></div>
        <div>
          <div class="name"><span class="nm"></span><span>${s.value} / ${MAX}</span></div>
          <div class="bar"><div class="fill" style="width:${s.value / MAX * 100}%; background:${s.color}"></div></div>
        </div>
        <div class="ctrl">
          <button class="minus" ${s.value <= 0 ? "disabled" : ""}>−</button>
          <button class="plus" ${s.value >= MAX || points <= 0 ? "disabled" : ""}>+</button>
          ${s.custom ? '<button class="del" title="Delete this stat">✕</button>' : ""}
        </div>`;

      if (s.custom) {
        // Custom stats: you type the icon and the name yourself
        const ic = document.createElement("input");
        ic.className = "icon-in"; ic.value = s.icon; ic.placeholder = "?"; ic.maxLength = 4; ic.title = "Type your own icon (emoji)";
        ic.onchange = () => { s.icon = ic.value.trim(); renderStats(); };
        row.querySelector(".icon").appendChild(ic);
        const nm = document.createElement("input");
        nm.className = "name-in"; nm.value = s.name; nm.maxLength = 20;
        nm.onchange = () => { s.name = nm.value.trim() || "My stat"; renderStats(); };
        row.querySelector(".nm").appendChild(nm);
        row.querySelector(".del").onclick = () => {
          // the stat's own points come back, and its +500 bonus leaves with it
          points = Math.max(0, points + s.value - BONUS_PER_STAT); stats.splice(i, 1); renderStats();
          flash("statMsg", `Stat deleted (−${BONUS_PER_STAT} bonus points).`);
        };
      } else {
        row.querySelector(".icon").textContent = s.icon;
        row.querySelector(".nm").textContent = s.name;
      }

      row.querySelector(".minus").onclick = () => {
        const take = Math.min(getAmount(), s.value);
        s.value -= take; points += take; renderStats();
      };
      row.querySelector(".plus").onclick = () => {
        const add = Math.min(getAmount(), points, MAX - s.value);
        s.value += add; points -= add; renderStats();
      };
      list.appendChild(row);
    });
  }

  // Add your own stat: each new one gives +500 points
  function addStat(name, icon) {
    name = String(name || "").trim().slice(0, 20);
    if (!name) return null;
    const n = stats.filter(s => s.custom).length;
    const st = { name, icon: String(icon || "").trim().slice(0, 4), value: 0, start: 0, color: CUSTOM_COLORS[n % CUSTOM_COLORS.length], custom: true };
    stats.push(st);
    points += BONUS_PER_STAT;
    renderStats();
    return st;
  }
  // Move a stat to a target number (never past MAX or past the points you have)
  function setStatValue(st, target) {
    target = Math.max(0, Math.min(MAX, Math.round(Number(target) || 0)));
    const diff = Math.min(target - st.value, points);
    st.value += diff; points -= diff;
    renderStats();
  }
  document.getElementById("addStatForm").onsubmit = e => {
    e.preventDefault();
    const st = addStat(document.getElementById("newStatName").value, document.getElementById("newStatIcon").value);
    if (!st) { document.getElementById("newStatName").focus(); return; }
    document.getElementById("newStatName").value = ""; document.getElementById("newStatIcon").value = "";
    flash("statMsg", `"${st.name}" added: +${BONUS_PER_STAT} points!`);
  };

  document.getElementById("openBtn").onclick  = () => document.getElementById("overlay").classList.add("show");
  document.getElementById("closeBtn").onclick = () => document.getElementById("overlay").classList.remove("show");
  document.getElementById("resetBtn").onclick = () => {
    stats.forEach(s => s.value = 0);
    points = budget(); renderStats();
  };

  // ================= GROQ AI ASSISTANT =================
  const AI_KEY = "punn-levelup-ai";
  let ai = { name: "", key: "", model: "openai/gpt-oss-120b" };
  try { ai = { ...ai, ...JSON.parse(localStorage.getItem(AI_KEY)) }; } catch (e) {}
  let history = []; // the conversation so far
  const aiReady = () => Boolean(ai.name && ai.key);   // you must create your AI first

  const aiPanel = document.getElementById("aiPanel");
  const chat = document.getElementById("chat");
  const aiSettings = document.getElementById("aiSettings");

  function showAiName() {
    const ready = aiReady();
    document.getElementById("aiBtnName").textContent = ready ? ai.name : "+ Create AI";
    document.getElementById("aiTitle").textContent = ready ? ai.name.toUpperCase() : "CREATE YOUR AI";
    document.getElementById("aiMsg").placeholder = ready ? `Ask ${ai.name} to plan or change something...` : "Create your AI first ☝️";
    document.getElementById("aiMsg").disabled = !ready;
    document.querySelectorAll(".chip").forEach(c => c.disabled = !ready);
    document.getElementById("setSave").textContent = ready ? "Save" : "Create my AI";
  }
  function openAiSettings() {
    document.getElementById("setName").value = ai.name;
    document.getElementById("setKey").value = ai.key;
    document.getElementById("setModel").value = ai.model;
    aiSettings.classList.add("show");
  }

  function bubble(text, who) {
    const b = document.createElement("div");
    b.className = "bubble " + who;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  document.getElementById("aiBtn").onclick = () => {
    aiPanel.classList.toggle("open");
    if (!aiReady()) { openAiSettings(); document.getElementById("setName").focus(); return; }
    if (!chat.children.length) bubble(`Hi! I'm ${ai.name} 👋 I can plan your day, add timetable blocks, and add or adjust your stats and activities. Just ask.`, "ai");
    document.getElementById("aiMsg").focus();
  };
  document.getElementById("aiClose").onclick = () => aiPanel.classList.remove("open");
  document.getElementById("aiSetBtn").onclick = () => { if (aiSettings.classList.contains("show") && aiReady()) aiSettings.classList.remove("show"); else openAiSettings(); };
  document.getElementById("setSave").onclick = () => {
    const name = document.getElementById("setName").value.trim();
    const key = document.getElementById("setKey").value.trim();
    if (!name || !key) { flash("setMsg", "Your AI needs a name AND a Groq key.", true); return; }
    const isNew = !aiReady();
    ai.name = name; ai.key = key;
    ai.model = document.getElementById("setModel").value.trim() || "openai/gpt-oss-120b";
    try { localStorage.setItem(AI_KEY, JSON.stringify(ai)); } catch (e) {}
    flash("setMsg", "");
    aiSettings.classList.remove("show");
    showAiName();
    bubble(isNew ? `${ai.name} is alive! 🤖 Ask me to plan your day or adjust your stats.` : `Saved! Call me ${ai.name} from now on 😎`, "note");
    document.getElementById("aiMsg").focus();
  };

  // What the AI knows about you (sent with every message)
  function systemPrompt() {
    const today = new Date(), tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    const day = d => JSON.stringify((save.events[dateKey(d)] || []).map(e => ({ title: e.title, start: e.start, end: e.end, category: e.type })));
    const cats = Object.keys(MODES).map(k => `${k} (${MODES[k].name})`).join(", ");
    return `You are ${ai.name}, a friendly, upbeat planning assistant (like ClickUp's AI) inside the "Level-Up Planner" app.
Keep replies short and fun. Help the user plan their day, balance study / exercise / gaming / sleep, and build good habits.
For schoolwork: help them PLAN and understand, but don't just do homework for them. Ask them to try first.

Right now: ${today.toLocaleString("en-GB")}. Today's date key: ${dateKey(today)}. Tomorrow's: ${dateKey(tmr)}.
Today's timetable: ${day(today)}
Tomorrow's timetable: ${day(tmr)}
Stats (each max ${MAX}): ${stats.map(s => s.name + " " + s.value).join(", ")}. Unspent points: ${points}. Creating a new stat gives +${BONUS_PER_STAT} points.
Activity categories (key (name)): ${cats}.

You can change the app. When you want to, add this at the very END of your reply (a JSON array, any mix of these):
\`\`\`actions
[{"action":"add_event","date":"YYYY-MM-DD","title":"Short title","start":"HH:MM","end":"HH:MM","category":"iq"},
 {"action":"delete_event","date":"YYYY-MM-DD","title":"exact title"},
 {"action":"add_stat","name":"Working","icon":"💼"},
 {"action":"set_stat","name":"IQ","value":120},
 {"action":"add_activity","name":"Piano","icon":"🎹"}]
\`\`\`
Use 24-hour times and category keys. Raising a stat spends unspent points, so never set stats higher than the points allow.
You cannot make or upload pictures: tell the user to press "Upload picture" in the Planner tab.
Only include actions the user asked for or agreed to. Never show this format otherwise.`;
  }

  // Apply the AI's changes
  function runActions(list) {
    list.forEach(a => {
      const type = MODES[a.category] ? a.category : "other";
      if (a.action === "add_event" && a.date && a.start && a.end) {
        addEvent(a.date, { title: `${MODES[type].icon} ${a.title}`.trim(), start: a.start, end: a.end, type });
        bubble(`✔ Added "${a.title}" on ${a.date} (${a.start}–${a.end})`, "note");
      }
      if (a.action === "delete_event" && a.date) {
        const arr = save.events[a.date] || [];
        const i = arr.findIndex(e => e.title.toLowerCase().includes(String(a.title).toLowerCase()));
        if (i >= 0) { bubble(`🗑 Removed "${arr[i].title}" on ${a.date}`, "note"); arr.splice(i, 1); store(); }
      }
      if (a.action === "add_stat") {
        const st = addStat(a.name, a.icon);
        if (st) bubble(`✔ New stat "${st.name}" (+${BONUS_PER_STAT} points)`, "note");
      }
      if (a.action === "set_stat") {
        const st = stats.find(x => x.name.toLowerCase() === String(a.name).toLowerCase());
        if (st) { setStatValue(st, a.value); bubble(`✔ ${st.name} is now ${st.value} (points left: ${points})`, "note"); }
        else bubble(`I couldn't find a stat called "${a.name}".`, "err");
      }
      if (a.action === "add_activity") {
        const act = addActivity(a.name, a.icon);
        if (act) bubble(`✔ New activity "${act.name}". Add its picture in the Planner tab.`, "note");
      }
    });
    renderDay(); renderSidebar(); renderPlanner();
  }

  async function askAI(text) {
    if (!aiReady()) { openAiSettings(); return; }
    bubble(text, "me");
    history.push({ role: "user", content: text });
    history = history.slice(-20);
    const thinking = bubble("…thinking", "ai");
    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ai.key },
        body: JSON.stringify({ model: ai.model, temperature: 0.6,
          messages: [{ role: "system", content: systemPrompt() }, ...history] }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || res.status);
      let reply = data.choices[0].message.content;
      history.push({ role: "assistant", content: reply });

      const m = reply.match(/```actions\s*([\s\S]*?)```/);
      reply = reply.replace(/```actions[\s\S]*?```/, "").trim();
      thinking.textContent = reply || "Done! ✅";
      if (m) { try { runActions(JSON.parse(m[1])); } catch (e) { bubble("I tried to change your timetable but got confused 😅 Try again?", "err"); } }
    } catch (err) {
      thinking.remove();
      bubble("Error: " + err.message + " (check your key / model in ⚙️)", "err");
    }
  }

  document.getElementById("aiForm").onsubmit = e => {
    e.preventDefault();
    const box = document.getElementById("aiMsg");
    if (box.value.trim()) { askAI(box.value.trim()); box.value = ""; }
  };
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => askAI(c.textContent));

  // The QuestCraft game calls this to jump straight to a tab: "timetable", "stopwatch", "planner" or "stats"
  function openTab(name) {
    const overlay = document.getElementById("overlay");
    if (name === "stats") { overlay.classList.add("show"); return; }   // open the STATS popup
    overlay.classList.remove("show");
    const id = { timetable: "tableView", stopwatch: "watchView", planner: "plannerView" }[name];
    const btn = id && document.querySelector(`.mode[data-view="${id}"]`);
    if (btn) btn.click();
    // inside the game, each screen is its own thing: hide the top tab bar
    document.body.classList.add("embedded");
  }

  // ================= START =================
  showAiName();
  refreshTypeSelects();
  setWatchMode("iq");
  renderSidebar();
  renderStats();
  renderDay();
  // scroll the timetable so you see the current hour
  document.getElementById("gridWrap").scrollTop = Math.max(0, (new Date().getHours() - START_HOUR - 2) * PX_PER_HOUR);
  setInterval(() => { if (dayOffset === 0) renderDay(); }, 60000);
</script>
</body>
</html>
